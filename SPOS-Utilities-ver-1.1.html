&lt;!-- RTZ &lt;-&gt; ABB SPOS Route Converter | standalone build extracted from Voyage Suite | works fully offline --&gt;
&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;utf-8&quot;/&gt;

&lt;style&gt;
  :root{
    --navy:#1c2b3a;
    --navy-light:#2c4258;
    --grey-bg:#f4f5f7;
    --grey-line:#d7dbe0;
    --grey-text:#5a6472;
    --red:#b3261e;
    --red-bg:#fbebea;
    --ink:#1a1f26;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
    --sans: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--grey-bg); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  header{
    background:var(--navy); color:#fff; padding:18px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  header h1{ font-size:17px; font-weight:600; margin:0; letter-spacing:0.2px;}
  header p{ margin:2px 0 0; font-size:12.5px; color:#b7c2cd;}
  .header-actions{ display:flex; gap:8px; flex-wrap:wrap;}
  .btn{
    font-family:var(--sans); font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:5px; border:1px solid transparent;
    cursor:pointer; transition:opacity .15s;
  }
  .btn:hover{opacity:.85;}
  .btn-ghost{ background:transparent; border-color:#3d5266; color:#dfe6ec;}
  .btn-primary{ background:#3d6a94; color:#fff;}
  .btn-red{ background:var(--red); color:#fff;}
  .btn-small{ padding:4px 9px; font-size:11.5px; border-radius:4px;}

  main{ max-width:1440px; margin:0 auto; padding:20px;}

  .notice{
    background:#eef3f7; border:1px solid #cfdae3; border-left:3px solid var(--navy-light);
    border-radius:4px; padding:10px 14px; font-size:12.5px; color:var(--grey-text); margin-bottom:16px;
    display:none;
  }
  .notice.show{ display:block; }

  .panels{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start;}
  @media (max-width:900px){ .panels{grid-template-columns:1fr;} }

  .panel{
    background:#fff; border:1px solid var(--grey-line); border-radius:8px; overflow:hidden;
    display:flex; flex-direction:column; min-height:220px;
  }
  .panel-head{
    padding:13px 16px; border-bottom:1px solid var(--grey-line); display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
  }
  .panel-head h2{ margin:0; font-size:14.5px; font-weight:700; letter-spacing:0.2px;}
  .panel-head h2.rtz-title{ color:var(--navy); }
  .panel-head h2.spos-title{ color:#E1251B; font-weight:700; letter-spacing:.3px; }
  .panel-tag{
    font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.4px; padding:2px 7px; border-radius:3px;
    background:var(--grey-bg); color:var(--grey-text); border:1px solid var(--grey-line);
  }
  .panel-tag.converted{ background:#fff7e6; color:#8a5b00; border-color:#f0dca6;}
  .panel-tag.loaded{ background:#e9f5ee; color:#1c6b3f; border-color:#bfe3cd;}

  .drop-zone{
    margin:16px; padding:26px 14px; border:2px dashed var(--grey-line); border-radius:8px; text-align:center;
    color:var(--grey-text); font-size:12.5px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .drop-zone:hover, .drop-zone.dragover{ border-color:var(--navy-light); background:#f7fafc;}
  .drop-zone .dz-icon{ font-size:22px; display:block; margin-bottom:6px; opacity:.5;}
  .drop-zone .dz-main{ font-weight:600; color:var(--ink); font-size:13px;}
  .drop-zone .dz-sub{ margin-top:3px;}
  .drop-zone input[type=file]{ display:none; }
  .drop-zone .dz-link{ color:var(--navy-light); text-decoration:underline; cursor:pointer;}

  .panel-body{ padding:0 16px 16px; display:none; flex:1; }
  .panel-body.show{ display:block; }

  .summary-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:8px 14px; margin:14px 0 16px; font-size:12px;
  }
  .summary-item .k{ color:var(--grey-text); font-size:10.5px; text-transform:uppercase; letter-spacing:0.3px; margin-bottom:2px;}
  .summary-item .v{ font-weight:600; word-break:break-word;}
  .summary-item .v.mono{ font-family:var(--mono); font-size:11.5px; font-weight:500;}

  table.wp-table{ width:100%; border-collapse:collapse; font-family:var(--mono); font-size:11px; margin-top:6px;}
  table.wp-table th{
    text-align:left; padding:6px 8px; background:var(--grey-bg); color:var(--grey-text); font-weight:600;
    position:sticky; top:0; border-bottom:1px solid var(--grey-line); font-family:var(--sans); text-transform:uppercase; font-size:9.5px; letter-spacing:0.3px;
  }
  table.wp-table td{ padding:5px 8px; border-bottom:1px solid #eef0f2; white-space:nowrap;}
  table.wp-table tr:last-child td{ border-bottom:none;}
  .table-scroll{ max-height:260px; overflow-y:auto; border:1px solid var(--grey-line); border-radius:6px;}
  .cell-muted{ color:#a7afb8; }
  .cell-ext{ color:var(--red); font-weight:600;}

  details.raw{ margin-top:12px; border:1px solid var(--grey-line); border-radius:6px; }
  details.raw summary{ padding:8px 12px; font-size:12px; font-weight:600; cursor:pointer; color:var(--navy-light); list-style:none; display:flex; align-items:center; justify-content:space-between;}
  details.raw summary::-webkit-details-marker{ display:none; }
  details.raw summary:after{ content:&quot;▸&quot;; transition:transform .15s; color:var(--grey-text);}
  details.raw[open] summary:after{ transform:rotate(90deg);}
  details.raw pre{
    margin:0; padding:12px; font-family:var(--mono); font-size:10.5px; line-height:1.5; background:#0f1720; color:#c9d5e0;
    max-height:280px; overflow:auto; border-top:1px solid var(--grey-line);
  }

  .panel-foot{ display:flex; gap:8px; margin-top:14px; }

  .log-section{
    background:#fff; border:1px solid var(--grey-line); border-radius:8px; padding:14px 16px; margin-top:16px; font-size:12.5px;
  }
  .log-section h3{ margin:0 0 8px; font-size:12.5px; text-transform:uppercase; letter-spacing:0.4px; color:var(--grey-text);}
  .log-section ul{ margin:0; padding-left:18px; color:var(--ink); line-height:1.7;}
  .log-section li b{ color:var(--navy);}
  .log-section .empty{ color:var(--grey-text); font-style:italic;}

  footer{ text-align:center; color:var(--grey-text); font-size:11px; padding:20px; }
&lt;/style&gt;

// ---------- small helpers ----------
function esc(s){
  return String(s).replace(/[&amp;&lt;&gt;&quot;']/g, c =&gt; ({'&amp;':'&amp;amp;','&lt;':'&amp;lt;','&gt;':'&amp;gt;','&quot;':'&amp;quot;',&quot;'&quot;:'&amp;apos;'}[c]));
}
function firstEl(root, tag){ return root.getElementsByTagName(tag)[0] || null; }
function allEl(root, tag){ return Array.from(root.getElementsByTagName(tag)); }
function fmtNum(n, d){ return (n === null || n === undefined || Number.isNaN(n)) ? '' : Number(n).toFixed(d); }

function formatDuration(iso){
  if(!iso) return '0 min';
  const m = /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+(?:\.\d+)?)S)?$/.exec(iso);
  if(!m) return iso;
  const h = parseInt(m[1]||0,10), mi = parseInt(m[2]||0,10), s = parseFloat(m[3]||0);
  const totalMin = h*60+mi+s/60;
  if(totalMin === 0) return '0 min';
  if(totalMin &lt; 60) return totalMin.toFixed(0)+' min';
  return (totalMin/60).toFixed(1)+' hr';
}

function fmtEta(iso){
  if(!iso) return '';
  try{
    const d = new Date(iso);
    return d.toISOString().slice(0,16).replace('T',' ');
  }catch(e){ return iso; }
}

// ---------- RTZ parsing ----------
function parseRTZ(text){
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('Could not parse file as RTZ / XML.');

  const routeInfoEl = firstEl(doc, 'routeInfo');
  const routeName = (routeInfoEl ? routeInfoEl.getAttribute('routeName') : '') || 'Unnamed Route';
  const vesselIMO = routeInfoEl ? (routeInfoEl.getAttribute('vesselIMO')||'') : '';
  const vesselName = routeInfoEl ? (routeInfoEl.getAttribute('vesselName')||'') : '';
  const vesselVoyage = routeInfoEl ? (routeInfoEl.getAttribute('vesselVoyage')||'') : '';

  const waypointsRoot = firstEl(doc, 'waypoints');
  const waypointEls = waypointsRoot ? allEl(waypointsRoot, 'waypoint') : [];

  const waypoints = waypointEls.map(wp =&gt; {
    const pos = firstEl(wp, 'position');
    const leg = firstEl(wp, 'leg');
    let sposExt = null;
    const manufacturers = allEl(wp, 'manufacturer');
    const sposManu = manufacturers.find(m =&gt; m.getAttribute('name') === 'ABB SPOS');
    if(sposManu){
      sposExt = {};
      allEl(sposManu, 'parameter').forEach(p =&gt; { sposExt[p.getAttribute('key')] = p.getAttribute('value'); });
    }
    return {
      id: wp.getAttribute('id'),
      lat: parseFloat(pos.getAttribute('lat')),
      lon: parseFloat(pos.getAttribute('lon')),
      geometryType: leg ? (leg.getAttribute('geometryType')||'Loxodrome') : 'Loxodrome',
      sposExt
    };
  });

  const speedMap = {}, etaMap = {};
  allEl(doc, 'schedule').forEach(sch =&gt; {
    let elements = allEl(sch, 'sheduleElement');
    if(!elements.length) elements = allEl(sch, 'scheduleElement');
    elements.forEach(el =&gt; {
      const wid = el.getAttribute('waypointId');
      const spd = el.getAttribute('speed');
      const eta = el.getAttribute('eta');
      if(spd !== null) speedMap[wid] = parseFloat(spd);
      if(eta) etaMap[wid] = eta;
    });
  });

  waypoints.forEach(wp =&gt; {
    wp.speed = speedMap[wp.id] !== undefined ? speedMap[wp.id] : null;
    wp.eta = etaMap[wp.id] || null;
  });

  return { format:'RTZ', routeName: routeName.trim(), vesselIMO, vesselName, vesselVoyage, waypoints };
}

// ---------- SPOS parsing ----------
function parseSPOS(text){
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('Could not parse file as SPOS / XML.');

  const templateEl = firstEl(doc, 'template');
  const routeName = (templateEl ? templateEl.getAttribute('name') : '') || 'Unnamed Route';
  const created = templateEl ? (templateEl.getAttribute('created')||'') : '';

  const waypointsRoot = firstEl(doc, 'waypoints');
  const waypointEls = waypointsRoot ? allEl(waypointsRoot, 'waypoint') : [];

  const waypoints = waypointEls.map((wp, idx) =&gt; ({
    id: String(idx+1),
    lat: parseFloat(wp.getAttribute('lat')),
    lon: parseFloat(wp.getAttribute('lon')),
    delay: wp.getAttribute('delay') || 'PT0S',
    speed: wp.getAttribute('speed') !== null ? parseFloat(wp.getAttribute('speed')) : 0,
    useSpeed: wp.getAttribute('useSpeed') === 'true',
    pointType: wp.getAttribute('routeTemplatePointType') || 'Fixed',
    ignoreRouteNetwork: wp.getAttribute('ignoreRouteNetwork') === 'true'
  }));

  return { format:'SPOS', routeName: routeName.trim(), created, waypoints };
}

// ---------- Build SPOS from RTZ ----------
function buildSPOSFromRTZ(route){
  const lines = [];
  lines.push('&lt;?xml version=&quot;1.0&quot; encoding=&quot;utf-8&quot;?&gt;');
  lines.push('&lt;sposroutetemplate xmlns:xsi=&quot;http://www.w3.org/2001/XMLSchema-instance&quot; xmlns:xsd=&quot;http://www.w3.org/2001/XMLSchema&quot; xmlVersion=&quot;1&quot; xmlns=&quot;http://www.meteogroup-maritime.com/spos/routetemplate&quot;&gt;');
  lines.push('  &lt;template name=&quot;'+esc(route.routeName)+'&quot; created=&quot;'+new Date().toISOString()+'&quot;&gt;');
  lines.push('    &lt;waypoints&gt;');

  // BOSS RTZ carries the speed for leg WP N -&gt; WP N+1 on WP N (speed to LEAVE WP N).
  // SPOS attaches speed to WP N+1 (speed to ARRIVE at WP N+1).
  // Shift each speed forward by one waypoint before writing SPOS. WP 1 has no
  // arrival speed and gets useSpeed=false.
  const arrivalSpeeds = route.waypoints.map((_, idx) =&gt; {
    if (idx === 0) return null;
    const prev = route.waypoints[idx - 1];
    return prev.speed !== null &amp;&amp; prev.speed !== undefined ? prev.speed : null;
  });

  route.waypoints.forEach((wp, idx) =&gt; {
    const ext = wp.sposExt; // recovered verbatim if this RTZ round-tripped from SPOS
    const delay = ext &amp;&amp; ext.delay ? ext.delay : 'PT0S';
    const arrSpd = arrivalSpeeds[idx];
    const hasSpeed = arrSpd !== null &amp;&amp; arrSpd !== undefined;
    const useSpeed = ext &amp;&amp; ext.useSpeed !== undefined ? (ext.useSpeed === 'true') : (hasSpeed &amp;&amp; arrSpd &gt; 0);
    const speedVal = hasSpeed ? arrSpd : (ext &amp;&amp; ext.speed ? parseFloat(ext.speed) : 0);
    const pointType = ext &amp;&amp; ext.routeTemplatePointType ? ext.routeTemplatePointType : 'Fixed';
    const ignoreNet = ext &amp;&amp; ext.ignoreRouteNetwork !== undefined ? (ext.ignoreRouteNetwork === 'true') : (idx !== 0);
    lines.push('      &lt;waypoint lat=&quot;'+wp.lat+'&quot; lon=&quot;'+wp.lon+'&quot; delay=&quot;'+delay+'&quot; speed=&quot;'+speedVal+'&quot; useSpeed=&quot;'+useSpeed+'&quot; routeTemplatePointType=&quot;'+pointType+'&quot; ignoreRouteNetwork=&quot;'+ignoreNet+'&quot; /&gt;');
  });

  lines.push('    &lt;/waypoints&gt;');
  lines.push('  &lt;/template&gt;');
  lines.push('&lt;/sposroutetemplate&gt;');
  return lines.join('\n');
}

// ---------- Build RTZ from SPOS ----------
function buildRTZFromSPOS(route){
  const lines = [];
  lines.push('&lt;route version=&quot;1.0&quot; xmlns=&quot;http://www.cirm.org/RTZ/1/0&quot; xmlns:xsi=&quot;http://www.w3.org/2001/XMLSchema-instance&quot;&gt;');
  lines.push('&lt;routeInfo routeName=&quot;'+esc(route.routeName)+'&quot; routeStatus=&quot;Undefined&quot; /&gt;');
  lines.push('&lt;waypoints&gt;');

  route.waypoints.forEach((wp, idx) =&gt; {
    lines.push('&lt;waypoint id=&quot;'+(idx+1)+'&quot; revision=&quot;0&quot;&gt;');
    lines.push('&lt;position lat=&quot;'+wp.lat+'&quot; lon=&quot;'+wp.lon+'&quot; /&gt;');
    lines.push('&lt;leg geometryType=&quot;Loxodrome&quot; /&gt;');
    lines.push('&lt;extensions&gt;&lt;extension&gt;&lt;manufacturer name=&quot;ABB SPOS&quot;&gt;');
    lines.push('&lt;parameter key=&quot;delay&quot; value=&quot;'+wp.delay+'&quot; /&gt;');
    lines.push('&lt;parameter key=&quot;useSpeed&quot; value=&quot;'+wp.useSpeed+'&quot; /&gt;');
    lines.push('&lt;parameter key=&quot;routeTemplatePointType&quot; value=&quot;'+wp.pointType+'&quot; /&gt;');
    lines.push('&lt;parameter key=&quot;ignoreRouteNetwork&quot; value=&quot;'+wp.ignoreRouteNetwork+'&quot; /&gt;');
    lines.push('&lt;/manufacturer&gt;&lt;/extension&gt;&lt;/extensions&gt;');
    lines.push('&lt;/waypoint&gt;');
  });

  lines.push('&lt;/waypoints&gt;');
  lines.push('&lt;schedules&gt;');
  // SPOS attaches speed to WP N+1 (speed to ARRIVE at WP N+1).
  // BOSS RTZ carries speed on WP N (speed to LEAVE WP N to reach WP N+1).
  // Shift each speed back by one waypoint: BOSS[N].speed = SPOS[N+1].speed.
  // The last waypoint has no outgoing leg — carry over the previous BOSS speed
  // so no schedule entry is truncated.
  const wps = route.waypoints;
  const bossSpeeds = wps.map((wp, idx) =&gt; {
    const nxt = wps[idx + 1];
    if (nxt) return (nxt.useSpeed ? nxt.speed : 0);
    // last waypoint: mirror previous leaving speed
    const prv = wps[idx - 1];
    if (prv) {
      const nn = wps[idx];  // its arrival speed
      return nn.useSpeed ? nn.speed : (prv.useSpeed ? prv.speed : 0);
    }
    return 0;
  });
  let schedId = 1000, i = 0;
  while(i &lt; wps.length){
    const speed = bossSpeeds[i];
    let j = i;
    const group = [];
    while(j &lt; wps.length &amp;&amp; bossSpeeds[j] === speed){ group.push(j); j++; }
    lines.push('&lt;schedule id=&quot;'+(schedId++)+'&quot;&gt;&lt;calculated&gt;');
    group.forEach(k =&gt; {
      lines.push('&lt;sheduleElement speed=&quot;'+speed+'&quot; waypointId=&quot;'+(k+1)+'&quot; /&gt;');
    });
    lines.push('&lt;/calculated&gt;&lt;/schedule&gt;');
    i = j;
  }
  lines.push('&lt;/schedules&gt;');
  lines.push('&lt;/route&gt;');
  return lines.join('\n');
}

// ---------- Rendering ----------
const state = { rtz:null, spos:null };

function showNotice(msg){
  const n = document.getElementById('notice');
  n.textContent = msg;
  n.classList.add('show');
  clearTimeout(showNotice._t);
  showNotice._t = setTimeout(()=&gt; n.classList.remove('show'), 6000);
}

function renderRTZ(route, sourceTag){
  state.rtz = route;
  document.getElementById('rtzDrop').style.display = 'none';
  const body = document.getElementById('rtzBody');
  body.classList.add('show');

  document.getElementById('rtzTag').textContent = sourceTag;
  document.getElementById('rtzTag').className = 'panel-tag ' + (sourceTag === 'Loaded' ? 'loaded' : 'converted');

  const wpCount = route.waypoints.length;
  const speeds = route.waypoints.map(w=&gt;w.speed).filter(s=&gt;s!==null &amp;&amp; s!==undefined);
  const speedRange = speeds.length ? Math.min(...speeds).toFixed(1)+' - '+Math.max(...speeds).toFixed(1)+' kn' : '—';
  const extCount = route.waypoints.filter(w=&gt;w.sposExt).length;

  document.getElementById('rtzSummary').innerHTML = [
    summaryItem('Route Name', route.routeName || '—'),
    summaryItem('Vessel', route.vesselName ? route.vesselName + (route.vesselIMO ? ' (IMO '+route.vesselIMO+')' : '') : '—'),
    summaryItem('Waypoints', wpCount),
    summaryItem('Speed Range', speedRange),
    summaryItem('SPOS Data Recovered', extCount + ' / ' + wpCount + ' waypoints', extCount&gt;0)
  ].join('');

  document.getElementById('rtzTableBody').innerHTML = route.waypoints.map((wp,i) =&gt; {
    const speedCell = (wp.speed===null||wp.speed===undefined) ? '&lt;span class=&quot;cell-muted&quot;&gt;—&lt;/span&gt;' : fmtNum(wp.speed,1);
    return '&lt;tr&gt;&lt;td&gt;'+(i+1)+'&lt;/td&gt;&lt;td&gt;'+fmtNum(wp.lat,5)+'&lt;/td&gt;&lt;td&gt;'+fmtNum(wp.lon,5)+'&lt;/td&gt;&lt;td&gt;'+wp.geometryType+'&lt;/td&gt;&lt;td&gt;'+speedCell+'&lt;/td&gt;&lt;td&gt;'+(fmtEta(wp.eta)||'&lt;span class=&quot;cell-muted&quot;&gt;—&lt;/span&gt;')+'&lt;/td&gt;&lt;/tr&gt;';
  }).join('');

  const raw = buildDisplayRTZ(route);
  document.getElementById('rtzRaw').textContent = raw;
  document.getElementById('rtzDownload').onclick = () =&gt; downloadFile(raw, (route.routeName||'route').replace(/[^a-z0-9]+/gi,'_')+'.rtz', 'application/xml');
}

function renderSPOS(route, sourceTag){
  state.spos = route;
  document.getElementById('sposDrop').style.display = 'none';
  const body = document.getElementById('sposBody');
  body.classList.add('show');

  document.getElementById('sposTag').textContent = sourceTag;
  document.getElementById('sposTag').className = 'panel-tag ' + (sourceTag === 'Loaded' ? 'loaded' : 'converted');

  const wpCount = route.waypoints.length;
  const activeSpeeds = route.waypoints.filter(w=&gt;w.useSpeed).map(w=&gt;w.speed);
  const speedRange = activeSpeeds.length ? Math.min(...activeSpeeds).toFixed(1)+' - '+Math.max(...activeSpeeds).toFixed(1)+' kn' : 'not set (0 kn)';
  const totalDrift = route.waypoints.reduce((sum,w)=&gt;{
    const m = /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+(?:\.\d+)?)S)?$/.exec(w.delay||'PT0S');
    if(!m) return sum;
    return sum + (parseInt(m[1]||0,10)*60 + parseInt(m[2]||0,10) + parseFloat(m[3]||0)/60);
  },0);

  document.getElementById('sposSummary').innerHTML = [
    summaryItem('Template Name', route.routeName || '—'),
    summaryItem('Created', route.created ? route.created.slice(0,16).replace('T',' ') : '—'),
    summaryItem('Waypoints', wpCount),
    summaryItem('Active Speed Range', speedRange),
    summaryItem('Total Drift/Delay', totalDrift&gt;0 ? totalDrift.toFixed(0)+' min' : 'none set')
  ].join('');

  document.getElementById('sposTableBody').innerHTML = route.waypoints.map((wp,i) =&gt; {
    const speedCell = wp.useSpeed ? fmtNum(wp.speed,1) : '&lt;span class=&quot;cell-muted&quot;&gt;—&lt;/span&gt;';
    const driftCell = (wp.delay &amp;&amp; wp.delay !== 'PT0S') ? '&lt;span class=&quot;cell-ext&quot;&gt;'+formatDuration(wp.delay)+'&lt;/span&gt;' : '&lt;span class=&quot;cell-muted&quot;&gt;0 min&lt;/span&gt;';
    return '&lt;tr&gt;&lt;td&gt;'+(i+1)+'&lt;/td&gt;&lt;td&gt;'+fmtNum(wp.lat,5)+'&lt;/td&gt;&lt;td&gt;'+fmtNum(wp.lon,5)+'&lt;/td&gt;&lt;td&gt;'+speedCell+'&lt;/td&gt;&lt;td&gt;'+(wp.useSpeed?'yes':'&lt;span class=&quot;cell-muted&quot;&gt;no&lt;/span&gt;')+'&lt;/td&gt;&lt;td&gt;'+driftCell+'&lt;/td&gt;&lt;td&gt;'+wp.pointType+'&lt;/td&gt;&lt;/tr&gt;';
  }).join('');

  const raw = buildDisplaySPOS(route);
  document.getElementById('sposRaw').textContent = raw;
  document.getElementById('sposDownload').onclick = () =&gt; {
    const d = new Date();
    const yymmdd = String(d.getFullYear()).slice(-2)
                 + String(d.getMonth()+1).padStart(2,'0')
                 + String(d.getDate()).padStart(2,'0');
    const vn = (route._vesselName || '').replace(/\s+/g,'');  // merge multi-word vessel names
    const base = vn ? (yymmdd + '_' + vn + '_') : (yymmdd + '_');
    downloadFile(raw, base + 'spos.xml', 'application/xml');
  };
}

function summaryItem(k,v,highlight){
  return '&lt;div class=&quot;summary-item&quot;&gt;&lt;div class=&quot;k&quot;&gt;'+esc(k)+'&lt;/div&gt;&lt;div class=&quot;v'+(highlight?' cell-ext':'')+'&quot;&gt;'+ (typeof v === 'string' ? esc(v) : v) +'&lt;/div&gt;&lt;/div&gt;';
}

function buildDisplayRTZ(route){ return route._raw || buildRTZFromSPOS(route); }
function buildDisplaySPOS(route){ return route._raw || buildSPOSFromRTZ(route); }

// AV-safe file save. Prefers the browser-native Save dialog (File System
// Access API) and falls back to a plain data-URI link. Deliberately avoids the
// Blob + createObjectURL/revokeObjectURL chain, which some antivirus engines
// flag heuristically.
function downloadFile(content, filename, mime){
  const ext = filename.split('.').pop();
  if (typeof window.showSaveFilePicker === 'function') {
    (async () =&gt; {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: 'XML route file', accept: { 'application/xml': ['.' + ext] } }]
        });
        const writable = await handle.createWritable();
        await writable.write(content);
        await writable.close();
      } catch (err) {
        if (err &amp;&amp; err.name === 'AbortError') return; // user cancelled the dialog
        dataUriDownload(content, filename, mime);
      }
    })();
  } else {
    dataUriDownload(content, filename, mime);
  }
}
function dataUriDownload(content, filename, mime){
  const a = document.createElement('a');
  a.href = 'data:' + mime + ';charset=utf-8,' + encodeURIComponent(content);
  a.download = filename;
  a.click();
}

function updateLog(entries){
  const list = document.getElementById('logList');
  if(!entries.length){ list.innerHTML = '&lt;li class=&quot;empty&quot;&gt;Load a route to see field-by-field mapping notes.&lt;/li&gt;'; return; }
  list.innerHTML = entries.map(e =&gt; '&lt;li&gt;'+e+'&lt;/li&gt;').join('');
}

// ---------- Orchestration ----------
function handleFileText(text, droppedPanel){
  let format;
  if(text.includes('sposroutetemplate')) format = 'SPOS';
  else if(text.includes('&lt;route') &amp;&amp; (text.includes('cirm.org/RTZ') || text.includes('&lt;routeInfo'))) format = 'RTZ';
  else {
    try { parseRTZ(text); format = 'RTZ'; }
    catch(e){
      try { parseSPOS(text); format = 'SPOS'; }
      catch(e2){ showNotice('Could not recognise this file as RTZ or SPOS XML.'); return; }
    }
  }

  if(format !== droppedPanel){
    showNotice('Detected '+format+' format — displayed in the '+(format==='RTZ'?'left':'right')+' panel automatically.');
  }

  try{
    if(format === 'RTZ'){
      const route = parseRTZ(text);
      route._raw = formatXmlPretty(text);
      renderRTZ(route, 'Loaded');
      // Template name = today's date MM.DD + vessel name (if available)
      const _d = new Date();
      const _mmdd = String(_d.getMonth()+1).padStart(2,'0') + '.' + String(_d.getDate()).padStart(2,'0');
      const _vn = (route.vesselName || '').trim();
      const _tplName = _vn ? (_mmdd + ' ' + _vn) : _mmdd;
      const spos = { format:'SPOS', routeName:_tplName, _vesselName:_vn, created:new Date().toISOString(), waypoints: route.waypoints.map(w=&gt;{
        const ext = w.sposExt;
        return {
          lat:w.lat, lon:w.lon,
          delay: ext &amp;&amp; ext.delay ? ext.delay : 'PT0S',
          speed: w.speed !== null ? w.speed : (ext &amp;&amp; ext.speed ? parseFloat(ext.speed) : 0),
          useSpeed: ext &amp;&amp; ext.useSpeed !== undefined ? ext.useSpeed==='true' : (w.speed !== null &amp;&amp; w.speed &gt; 0),
          pointType: ext &amp;&amp; ext.routeTemplatePointType ? ext.routeTemplatePointType : 'Fixed',
          ignoreRouteNetwork: ext &amp;&amp; ext.ignoreRouteNetwork !== undefined ? ext.ignoreRouteNetwork==='true' : true
        };
      })};
      renderSPOS(spos, 'Converted');

      const extCount = route.waypoints.filter(w=&gt;w.sposExt).length;
      const log = [
        '&lt;b&gt;'+route.waypoints.length+' waypoints&lt;/b&gt; and per-leg speed read from RTZ &lt;code&gt;&amp;lt;schedules&amp;gt;&lt;/code&gt; and mapped to SPOS &lt;code&gt;speed&lt;/code&gt; / &lt;code&gt;useSpeed&lt;/code&gt;.',
        (route.vesselName || route.vesselIMO) ? 'Vessel identity (&lt;b&gt;'+esc(route.vesselName||'')+(route.vesselIMO?' / IMO '+route.vesselIMO:'')+'&lt;/b&gt;) has no field in the SPOS route-template schema — carried in the summary panel only, not written to the SPOS file.' : '',
        extCount&gt;0 ? '&lt;b&gt;'+extCount+' waypoint(s)&lt;/b&gt; carried SPOS drift/delay data in RTZ &amp;lt;extensions&amp;gt; — restored exactly into the generated SPOS file.' : 'No SPOS drift/delay extension data found in this RTZ — SPOS output defaults to &lt;code&gt;delay=&quot;PT0S&quot;&lt;/code&gt;.',
        'ETA values present in the RTZ schedule are shown for reference but have no field in the SPOS waypoint schema.'
      ].filter(Boolean);
      updateLog(log);

    } else {
      const route = parseSPOS(text);
      route._raw = formatXmlPretty(text);
      renderSPOS(route, 'Loaded');
      const rtz = { format:'RTZ', routeName:route.routeName, waypoints: route.waypoints.map(w=&gt;({
        lat:w.lat, lon:w.lon, geometryType:'Loxodrome',
        speed: w.useSpeed ? w.speed : null,
        eta: null,
        sposExt: { delay:w.delay, useSpeed:String(w.useSpeed), speed:String(w.speed), routeTemplatePointType:w.pointType, ignoreRouteNetwork:String(w.ignoreRouteNetwork) }
      }))};
      renderRTZ(rtz, 'Converted');

      const driftCount = route.waypoints.filter(w=&gt;w.delay &amp;&amp; w.delay !== 'PT0S').length;
      const log = [
        '&lt;b&gt;'+route.waypoints.length+' waypoints&lt;/b&gt; converted to RTZ with &lt;code&gt;&amp;lt;position&amp;gt;&lt;/code&gt; and &lt;code&gt;Loxodrome&lt;/code&gt; leg geometry (SPOS has no geometry-type field, so Loxodrome/rhumb line is assumed).',
        driftCount&gt;0 ? '&lt;b&gt;'+driftCount+' waypoint(s)&lt;/b&gt; have non-zero drift/delay time — this has &lt;b&gt;no native RTZ field&lt;/b&gt;, so it is preserved in an &lt;code&gt;&amp;lt;extensions&amp;gt;&lt;/code&gt; block (manufacturer=&quot;ABB SPOS&quot;) rather than being lost.' : 'No drift/delay time set on this route (all &lt;code&gt;PT0S&lt;/code&gt;).',
        'Active SPOS speeds grouped into contiguous RTZ &lt;code&gt;&amp;lt;schedule&amp;gt;&lt;/code&gt; blocks. ETAs are &lt;b&gt;not recalculated&lt;/b&gt; — RTZ schedule elements are written without an &lt;code&gt;eta&lt;/code&gt; attribute since SPOS does not export absolute timing.',
        'SPOS &lt;code&gt;useSpeed&lt;/code&gt; / &lt;code&gt;routeTemplatePointType&lt;/code&gt; / &lt;code&gt;ignoreRouteNetwork&lt;/code&gt; also carried into the same extension block for a lossless round-trip.'
      ].filter(Boolean);
      updateLog(log);
    }
  } catch(err){
    showNotice('Error parsing file: ' + err.message);
  }
}

// crude pretty-printer for raw XML display
function formatXmlPretty(xml){
  let formatted = '', indent = '';
  const nodes = xml.replace(/&gt;&lt;/g, '&gt;\n&lt;').split('\n');
  nodes.forEach(node =&gt; {
    if(node.match(/^&lt;\/\w/)) indent = indent.substring(2);
    formatted += indent + node + '\n';
    if(node.match(/^&lt;\?/) || node.match(/\/&gt;$/) || node.match(/^&lt;\w[^&gt;]*\/&gt;/)) { /* self-closing / decl, no indent change */ }
    else if(node.match(/^&lt;\w[^&gt;]*[^\/]&gt;$/)) indent += '  ';
  });
  return formatted.trim();
}

// ---------- wiring drop zones ----------
function wireDropZone(zoneId, inputId, panelKey){
  const zone = document.getElementById(zoneId);
  const input = document.getElementById(inputId);
  zone.addEventListener('click', () =&gt; input.click());
  input.addEventListener('change', e =&gt; {
    const f = e.target.files[0];
    if(f) readFile(f, panelKey);
  });
  ['dragenter','dragover'].forEach(evt =&gt; zone.addEventListener(evt, e =&gt; { e.preventDefault(); zone.classList.add('dragover'); }));
  ['dragleave','drop'].forEach(evt =&gt; zone.addEventListener(evt, e =&gt; { e.preventDefault(); zone.classList.remove('dragover'); }));
  zone.addEventListener('drop', e =&gt; {
    const f = e.dataTransfer.files[0];
    if(f) readFile(f, panelKey);
  });
}

function readFile(file, panelKey){
  const reader = new FileReader();
  reader.onload = ev =&gt; handleFileText(ev.target.result, panelKey);
  reader.onerror = () =&gt; showNotice('Could not read file: ' + file.name);
  reader.readAsText(file);
}

  ['rtz','spos'].forEach(p =&gt; {
    document.getElementById(p+'Drop').style.display = '';
    document.getElementById(p+'Body').classList.remove('show');
    document.getElementById(p+'Tag').textContent = 'Empty';
    document.getElementById(p+'Tag').className = 'panel-tag';
  });
  updateLog([]);
});

.btn-red{background:transparent;border:1px solid #cc0000;color:#cc0000;}
.btn-sm{padding:4px 10px;font-size:11px;}
.imo-row{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;}
#mt-link-row{display:none;align-self:flex-end;}
#mt-link-row a{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:12px;text-decoration:none;font-weight:600;border-bottom:1px dashed var(--accent);}
#fetch-status{font-size:11px;padding:4px 10px;border-radius:2px;display:none;font-weight:600;align-self:flex-end;}
.status-loading{background:rgba(230,81,0,.12);color:var(--warn);display:inline-flex!important;}
.status-ok{background:rgba(46,125,50,.12);color:var(--success);display:inline-flex!important;}
.status-manual{background:rgba(90,110,130,.12);color:var(--muted);display:inline-flex!important;}
.status-error{background:rgba(183,28,28,.10);color:var(--danger);display:inline-flex!important;}
.vessel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.vessel-grid .field-group input,.vessel-grid .field-group select{width:100%;}
.fuel-section{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start;}
.fuel-table-wrap{overflow-x:auto;}
table{border-collapse:collapse;font-size:12px;min-width:280px;width:100%;}
thead th{background:var(--panel);color:var(--label);font-size:11px;font-weight:700;text-transform:uppercase;padding:7px 10px;text-align:left;border:1px solid var(--border);}
tbody td{padding:4px 6px;border:1px solid var(--border);background:var(--input-bg);vertical-align:middle;}
tbody tr:nth-child(even) td{background:rgba(0,0,0,.03);}
tbody td input[type=number]{width:80px;border:none;background:transparent;padding:3px 4px;}
tbody td input[type=number]:focus{background:#fff;border:1px solid var(--accent);border-radius:2px;}
.del-btn{background:transparent;border:none;color:var(--danger);cursor:pointer;padding:2px 6px;font-size:13px;opacity:.55;}
.del-btn:hover{opacity:1;}
.table-actions{display:flex;gap:8px;margin-top:8px;}
.chart-header{font-size:11px;font-weight:700;color:var(--label);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;text-align:center;}
#fuel-chart-wrap{position:relative;height:320px;min-width:340px;}
#compare-chart-wrap{position:relative;height:320px;width:100%;}
.imp-chart-wrap{position:relative;height:280px;width:100%;}
canvas{width:100%!important;height:100%!important;}
hr{border:none;border-top:1px solid var(--border);margin:12px 0;}
.other-fuel-row{display:flex;align-items:center;gap:12px;}
.other-fuel-row label{font-size:11px;font-weight:600;color:var(--label);}
.paste-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;display:block;}
textarea{width:100%;min-height:80px;max-height:140px;resize:vertical;font-family:'Courier New',monospace;font-size:11.5px;line-height:1.6;}
.paste-actions{display:flex;gap:8px;margin-top:6px;align-items:center;}
.rpm-footnote{font-size:11px;color:#cc0000;font-style:normal;margin-top:8px;font-weight:500;}
.note{font-size:10.5px;color:var(--muted);margin-top:8px;font-style:italic;}
.note-blue{font-size:10.5px;color:#1565c0;font-weight:600;margin-top:8px;}
.ref-block{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px;}
.ref-arrow{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
.ref-arrow span{font-size:9px;color:#cc0000;font-weight:700;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;}
.ref-img{border:1px solid var(--border);border-radius:4px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.10);}
.generate-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.generate-bar .hint{font-size:11px;color:var(--muted);}
#xml-preview-section{display:none;}
#xml-output{background:#f0f5fa;border:1px solid var(--border);border-radius:3px;padding:14px;font-family:'Courier New',monospace;font-size:11.5px;line-height:1.65;color:#1a3a55;white-space:pre;overflow-x:auto;max-height:320px;overflow-y:auto;}
.xml-actions{display:flex;gap:10px;margin-top:10px;}
#comparison-section{display:none;margin-bottom:16px;}
.compare-tables{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.compare-label{font-size:11px;font-weight:700;color:var(--label);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.compare-label.before{color:#1565c0;}
.compare-label.after{color:#cc0000;}
.import-drop{border:2px dashed var(--input-border);border-radius:6px;padding:28px;text-align:center;background:var(--input-bg);cursor:pointer;transition:border-color .2s;}
.import-drop:hover,.import-drop.dragover{border-color:var(--accent);background:#fff;}
.import-drop p{color:var(--muted);font-size:13px;margin-bottom:10px;}
.register-table{width:100%;border-collapse:collapse;font-size:12px;}
.register-table th{background:var(--panel);color:var(--label);font-size:11px;font-weight:700;text-transform:uppercase;padding:8px 10px;text-align:left;border:1px solid var(--border);}
.register-table td{padding:7px 10px;border:1px solid var(--border);background:var(--input-bg);vertical-align:middle;}
.register-table tr:nth-child(even) td{background:rgba(0,0,0,.03);}
.register-table tr:hover td{background:rgba(204,0,0,.04);}
.reg-empty{text-align:center;color:var(--muted);font-style:italic;padding:24px;}
.reg-remarks-input{width:100%;border:none;background:transparent;font-size:12px;color:var(--text);font-family:'Open Sans',sans-serif;}
.reg-remarks-input:focus{background:#fff;border:1px solid var(--accent);border-radius:2px;padding:2px 4px;outline:none;}
.badge{display:inline-block;padding:2px 8px;border-radius:2px;font-size:10px;font-weight:700;text-transform:uppercase;}
.badge-L{background:rgba(46,125,50,.15);color:#2e7d32;}
.badge-B{background:rgba(21,101,192,.15);color:#1565c0;}
.badge-cls{background:rgba(90,110,130,.15);color:var(--label);}

// ── IMO ──
function updateMTLink() {
  var imo = document.getElementById('imo-input').value.trim();
  var lr = document.getElementById('mt-link-row');
  if (/^\d{7,9}$/.test(imo)) {
    document.getElementById('mt-link').href = 'https://www.marinetraffic.com/en/ais/details/ships/imo:' + imo;
    lr.style.display = 'flex';
    clearTimeout(imoFetchTimer);
    imoFetchTimer = setTimeout(function(){ autoFetchVesselName(imo); }, 700);
  } else {
    lr.style.display = 'none';
    clearTimeout(imoFetchTimer);
  }
}

function autoFetchVesselName(imo) {
  var nameField = document.getElementById('v-name');
  if (nameField.value.trim()) return;
  setStatus('loading','Looking up vessel name...');
  fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-20250514', max_tokens:200,
      tools:[{type:'web_search_20250305',name:'web_search'}],
      system:'Maritime lookup. Return ONLY JSON: {&quot;name&quot;:&quot;VESSEL NAME&quot;}. No markdown.',
      messages:[{role:'user',content:'Vessel name for IMO '+imo+'? JSON only.'}]
    })
  })
  .then(function(r){ return r.json(); })
  .then(function(data) {
    var text = (data.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('');
    var m = text.match(/\{[\s\S]*?\}/);
    if (m) {
      try {
        var obj = JSON.parse(m[0]);
        if (obj.name &amp;&amp; obj.name !== 'null') {
          nameField.value = obj.name;
          setStatus('ok','Vessel: '+obj.name);
          return;
        }
      } catch(e){}
    }
    setStatus('manual','Name not found — enter manually');
  })
  .catch(function(){ setStatus('manual','Lookup failed — enter manually'); });
}

function setStatus(type, msg) {
  var el = document.getElementById('fetch-status');
  el.className = 'status-'+type;
  el.textContent = msg;
  el.style.display = 'inline-flex';
}

// ── MT PARSER ──
function parseMTCharacteristics() {
  var raw = document.getElementById('mt-paste').value;
  if (!raw.trim()) { alert('Paste area is empty.'); return; }
  var lines = raw.split('\n');
  var name=null, lpp=null, draft=null, beam=null;

  // Name
  var nm = raw.match(/Vessel\s+Name[\s:]+([^\n]+)/i);
  if (!nm) {
    for (var i=0;i&lt;lines.length;i++) {
      var t=lines[i].trim();
      if (/^[A-Z][A-Z\s\-]{4,}[A-Z]$/.test(t) &amp;&amp; !/\d/.test(t)) { nm=[null,t]; break; }
    }
  }
  if (nm) name = nm[1].trim();

  // LPP — skip &quot;overall&quot; lines
  for (var i=0;i&lt;lines.length;i++) {
    var l=lines[i];
    if (/overall|length\s+overall/i.test(l)) continue;
    var m = l.match(/(?:Length\s*(?:B\.?P\.?|BP|Between\s*Perp(?:endiculars)?)|LPP|LBP)[\s:]+(\d+(?:[.,]\d+)?)/i);
    if (m) { lpp = parseFloat(m[1].replace(',','.')); break; }
  }
  if (!lpp) {
    var m = raw.match(/\bLpp\b[\s:]+(\d+(?:[.,]\d+)?)/i);
    if (m) lpp = parseFloat(m[1].replace(',','.'));
  }

  // Draught
  for (var i=0;i&lt;lines.length;i++) {
    var m = lines[i].match(/(?:Max(?:imum)?\s+)?Dr(?:a(?:u|a)ft|aught)[\s:]+(\d+(?:[.,]\d+)?)/i);
    if (m) { draft = parseFloat(m[1].replace(',','.')); break; }
  }

  // Beam
  for (var i=0;i&lt;lines.length;i++) {
    var m = lines[i].match(/(?:Breadth(?:\s+Moulded)?|Beam)[\s:]+(\d+(?:[.,]\d+)?)/i);
    if (m) { beam = parseFloat(m[1].replace(',','.')); break; }
  }

  if (name)  document.getElementById('v-name').value  = name;
  if (lpp)   document.getElementById('v-lpp').value   = lpp;
  if (draft) document.getElementById('v-draft').value = draft;
  if (beam)  document.getElementById('v-beam').value  = beam;

  var found = [name&amp;&amp;'Name',lpp&amp;&amp;'LPP',draft&amp;&amp;'Draught',beam&amp;&amp;'Beam'].filter(Boolean);
  var missed = ['Name','LPP','Draught','Beam'].filter(function(f){return found.indexOf(f)&lt;0;});
  setStatus(found.length?'ok':'manual',
    found.length ? 'Extracted: '+found.join(', ')+(missed.length?' — fill manually: '+missed.join(', '):'')
                 : 'Could not extract — fill manually');
}

// ── FUEL TABLE ──
function renderFuelTable() {
  var tbody = document.getElementById('fuel-body');
  tbody.innerHTML = '';
  for (var i=0; i&lt;fuelRows.length; i++) {
    (function(row,idx){
      var tr = document.createElement('tr');
      tr.innerHTML =
        '&lt;td&gt;&lt;input type=&quot;number&quot; value=&quot;'+row.speed+'&quot; step=&quot;0.1&quot; onchange=&quot;fuelRows['+idx+'].speed=+this.value;renderChart();checkComparison()&quot;&gt;&lt;/td&gt;'+
        '&lt;td&gt;&lt;input type=&quot;number&quot; value=&quot;'+row.rpm+'&quot; step=&quot;1&quot; onchange=&quot;fuelRows['+idx+'].rpm=+this.value&quot;&gt;&lt;/td&gt;'+
        '&lt;td&gt;&lt;input type=&quot;number&quot; value=&quot;'+row.fuel+'&quot; step=&quot;0.1&quot; onchange=&quot;fuelRows['+idx+'].fuel=+this.value;renderChart();checkComparison()&quot;&gt;&lt;/td&gt;'+
        '&lt;td&gt;&lt;button class=&quot;del-btn&quot; onclick=&quot;deleteFuelRow('+idx+')&quot;&gt;&amp;#215;&lt;/button&gt;&lt;/td&gt;';
      tbody.appendChild(tr);
    })(fuelRows[i], i);
  }
}

function syncFuelRows() {
  var rows = document.querySelectorAll('#fuel-body tr');
  fuelRows = [];
  rows.forEach(function(tr) {
    var inp = tr.querySelectorAll('input');
    fuelRows.push({speed:parseFloat(inp[0].value)||0, rpm:parseFloat(inp[1].value)||0, fuel:parseFloat(inp[2].value)||0});
  });
}

function addFuelRow() { syncFuelRows(); fuelRows.push({speed:0,rpm:0,fuel:0}); renderFuelTable(); renderChart(); }
function deleteFuelRow(i) { syncFuelRows(); fuelRows.splice(i,1); renderFuelTable(); renderChart(); checkComparison(); }

function importPastedData() {
  var raw = document.getElementById('paste-input').value.trim();
  if (!raw) { alert('Paste area is empty.'); return; }
  var parsed = [];
  var lines = raw.split('\n');
  for (var i=0;i&lt;lines.length;i++) {
    var parts = lines[i].trim().split(/\s+/).filter(function(p){return p!=='';});
    if (parts.length &lt; 2) continue;
    var speed = parseFloat(parts[0]);
    var fuel  = parseFloat(parts[parts.length-1]);
    if (!isNaN(speed) &amp;&amp; !isNaN(fuel)) parsed.push({speed:speed,fuel:fuel});
  }
  if (!parsed.length) { alert('No valid data found.'); return; }
  parsed.sort(function(a,b){return a.speed-b.speed;});
  fuelRows = parsed.map(function(r,i){ return {speed:r.speed, fuel:r.fuel, rpm:50+i*7}; });
  renderFuelTable(); renderChart(); checkComparison();
  document.getElementById('paste-input').value = '';
}

         grid:{color:'#cfdcea'},ticks:{color:'#5a6e82',font:{family:'Open Sans',size:10}}},
      y:{title:{display:true,text:yLabel,color:'#5a6e82',font:{family:'Open Sans',size:11}},
         grid:{color:'#cfdcea'},ticks:{color:'#5a6e82',font:{family:'Open Sans',size:10}}}
    }
  };
}

function renderChart() {

  var ctx = document.getElementById('fuelChart').getContext('2d');
  chartInstance = new Chart(ctx, {
    type:'line',
    data:{labels:sorted.map(function(r){return r.speed;}), datasets:[{
      label:'Fuel [mT/day]', data:sorted.map(function(r){return r.fuel;}),
      borderColor:'#cc0000', backgroundColor:'rgba(204,0,0,0.07)',
      pointBackgroundColor:'#cc0000', pointBorderColor:'#fff', pointBorderWidth:1.5,
      pointRadius:5, pointHoverRadius:7, fill:true, tension:0.35, borderWidth:2
    }]},
    options: getChartOpts('Speed [kts]','Fuel [mT/day]',false)
  });
}

function renderCompareChart(beforeRows, afterRows) {
  if (compareChartInstance) compareChartInstance.destroy();
  var bS = beforeRows.slice().sort(function(a,b){return a.speed-b.speed;});
  var aS = afterRows.slice().sort(function(a,b){return a.speed-b.speed;});
  var ctx = document.getElementById('compareChart').getContext('2d');
  compareChartInstance = new Chart(ctx, {
    type:'line',
    data:{
      labels: bS.map(function(r){return r.speed;}),

// ── XML IMPORT ──
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('import-drop').classList.remove('dragover');
  var file = e.dataTransfer.files[0];
  if (file) parseXMLFile(file);
}

function loadXMLFile(input) {
  var file = input.files[0];
  if (file) parseXMLFile(file);
}

function parseXMLFile(file) {
  if (!file.name.toLowerCase().endsWith('.xml')) { alert('Please select an .xml file.'); return; }
  var fn = document.getElementById('import-file-name');
  fn.textContent = file.name; fn.style.display = 'block';
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var parser = new DOMParser();
      var doc = parser.parseFromString(e.target.result, 'application/xml');
      var ns = 'http://www.meteogroup-maritime.com/spos/shipprofile';

      function g(tag) {
        var el = doc.getElementsByTagNameNS(ns,tag)[0] || doc.getElementsByTagName(tag)[0];
        return el ? el.textContent.trim() : '';
      }

      var profileName = g('name');
      var vName=profileName, vClass='', vCond='L';
      var nm = profileName.match(/^(.+)_\(([^)]+)\)\s*-\s*([LB])$/);
      if (nm) { vName=nm[1].trim(); vClass=nm[2].trim(); vCond=nm[3].trim(); }

      var lpp   = g('lpp');
      var beam  = g('beam');
      var draft = g('draft');
      var other = g('otherfuelcomsumption') || '0';

      var addEls = Array.from(doc.getElementsByTagNameNS(ns,'add'));
      if (!addEls.length) addEls = Array.from(doc.getElementsByTagName('add'));
      var seen = {};
      var rows = [];
      addEls.forEach(function(el) {
        var key = el.getAttribute('speed')+'_'+el.getAttribute('fuel');
        if (seen[key]) return; seen[key]=true;
        rows.push({speed:parseFloat(el.getAttribute('speed')), fuel:parseFloat(el.getAttribute('fuel')), rpm:parseFloat(el.getAttribute('rpm'))});
      });

      pendingImport = {profileName:profileName,vName:vName,vClass:vClass,vCond:vCond,lpp:lpp,beam:beam,draft:draft,other:other,rows:rows};

      document.getElementById('imp-name').value = vName;
      document.getElementById('imp-profile-name').value = profileName;
      document.getElementById('imp-lpp').value   = lpp;
      document.getElementById('imp-draft').value = draft;
      document.getElementById('imp-beam').value  = beam;
      document.getElementById('imp-other').value = other;

      document.getElementById('imp-fuel-body').innerHTML =
        rows.map(function(r){return '&lt;tr&gt;&lt;td&gt;'+r.speed+'&lt;/td&gt;&lt;td&gt;'+r.rpm+'&lt;/td&gt;&lt;td&gt;'+r.fuel+'&lt;/td&gt;&lt;/tr&gt;';}).join('');

      if (importChartInstance) importChartInstance.destroy();
      var sorted = rows.slice().sort(function(a,b){return a.speed-b.speed;});
      var ctx = document.getElementById('importChart').getContext('2d');
      importChartInstance = new Chart(ctx, {
        type:'line',
        data:{labels:sorted.map(function(r){return r.speed;}), datasets:[{
          label:'Fuel [mT/day]', data:sorted.map(function(r){return r.fuel;}),
          borderColor:'#1565c0', backgroundColor:'rgba(21,101,192,0.08)',
          pointBackgroundColor:'#1565c0', pointBorderColor:'#fff', pointBorderWidth:1.5,
          pointRadius:5, fill:true, tension:0.35, borderWidth:2
        }]},
        options: getChartOpts('Speed [kts]','Fuel [mT/day]',false)
      });
      document.getElementById('import-preview').style.display = 'block';
    } catch(err) { alert('Failed to parse XML: '+err.message); }
  };
  reader.readAsText(file);
}

function applyImportedProfile() {
  if (!pendingImport) return;
  var d = pendingImport;
  document.getElementById('v-name').value      = d.vName;
  document.getElementById('v-class').value     = d.vClass;
  document.getElementById('v-condition').value = d.vCond;
  document.getElementById('v-lpp').value       = d.lpp;

}

// ── REGISTER ──
var REG_KEY = 'spos_profile_register';

function saveToRegister() {
  if (!generatedXML) return;
  var vName  = document.getElementById('v-name').value.trim();
  var vClass = document.getElementById('v-class').value;
  var vCond  = document.getElementById('v-condition').value;
  var now    = new Date().toISOString().slice(0,10);
  var reg = getRegister();
  reg.unshift({id:Date.now(), name:vName, cls:vClass, cond:vCond, date:now, remarks:'', xml:generatedXML});
  localStorage.setItem(REG_KEY, JSON.stringify(reg));
  document.getElementById('save-confirm').style.display = 'block';
  setTimeout(function(){ document.getElementById('save-confirm').style.display='none'; }, 4000);
}

function getRegister() {
  try { return JSON.parse(localStorage.getItem(REG_KEY)||'[]'); } catch(e) { return []; }
}

function renderRegister() {
  var reg = getRegister();
  var c = document.getElementById('register-container');
  if (!reg.length) { c.innerHTML='&lt;p class=&quot;reg-empty&quot;&gt;No profiles saved yet. Generate a profile and click &amp;#8220;Save to Register&amp;#8221;.&lt;/p&gt;'; return; }
  var rows = reg.map(function(r,i) {
    return '&lt;tr&gt;'+
      '&lt;td style=&quot;color:var(--muted);font-size:11px;&quot;&gt;'+(i+1)+'&lt;/td&gt;'+
      '&lt;td style=&quot;font-weight:600;&quot;&gt;'+esc(r.name||'—')+'&lt;/td&gt;'+
      '&lt;td&gt;&lt;span class=&quot;badge badge-cls&quot;&gt;'+esc(r.cls||'—')+'&lt;/span&gt;&lt;/td&gt;'+
      '&lt;td&gt;&lt;span class=&quot;badge badge-'+r.cond+'&quot;&gt;'+r.cond+'&lt;/span&gt;&lt;/td&gt;'+
      '&lt;td style=&quot;white-space:nowrap;color:var(--muted);&quot;&gt;'+r.date+'&lt;/td&gt;'+
      '&lt;td&gt;&lt;input class=&quot;reg-remarks-input&quot; type=&quot;text&quot; value=&quot;'+esc(r.remarks||'')+'&quot; placeholder=&quot;Add remarks…&quot; onchange=&quot;updateRemarks('+r.id+',this.value)&quot;&gt;&lt;/td&gt;'+
      '&lt;td style=&quot;white-space:nowrap;&quot;&gt;'+
        '&lt;button class=&quot;btn btn-primary btn-sm&quot; onclick=&quot;loadFromRegister('+r.id+')&quot;&gt;Load&lt;/button&gt; '+
        '&lt;button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;dlFromRegister('+r.id+')&quot;&gt;&amp;#8595; XML&lt;/button&gt; '+
        '&lt;button class=&quot;btn btn-red btn-sm&quot; onclick=&quot;delFromRegister('+r.id+')&quot;&gt;&amp;#215;&lt;/button&gt;'+
      '&lt;/td&gt;'+
    '&lt;/tr&gt;';
  }).join('');
  c.innerHTML = '&lt;table class=&quot;register-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Vessel Name&lt;/th&gt;&lt;th&gt;Class&lt;/th&gt;&lt;th&gt;Cond.&lt;/th&gt;&lt;th&gt;Date Saved&lt;/th&gt;&lt;th&gt;User Remarks&lt;/th&gt;&lt;th&gt;Actions&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;'+rows+'&lt;/tbody&gt;&lt;/table&gt;';
}

function esc(s) { return String(s).replace(/&amp;/g,'&amp;amp;').replace(/&lt;/g,'&amp;lt;').replace(/&gt;/g,'&amp;gt;').replace(/&quot;/g,'&amp;quot;'); }

function updateRemarks(id,val) {
  var reg = getRegister();
  var entry = reg.find(function(r){return r.id===id;});
  if (entry) { entry.remarks=val; localStorage.setItem(REG_KEY,JSON.stringify(reg)); }
}

function loadFromRegister(id) {
  var reg = getRegister();
  var entry = reg.find(function(r){return r.id===id;});
  if (!entry||!entry.xml) return;
  var blob = new Blob([entry.xml],{type:'application/xml'});
  var file = new File([blob],(entry.name||'vessel')+'.xml',{type:'application/xml'});
  pendingImport = null;
  parseXMLFile(file);
  switchTab('import');
}

function dlFromRegister(id) {
  var reg = getRegister();
  var entry = reg.find(function(r){return r.id===id;});
  if (!entry||!entry.xml) return;
  var blob = new Blob([entry.xml],{type:'application/xml'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = ((entry.name||'vessel').replace(/\s+/g,'_')+'_'+entry.cls+'_'+entry.cond+'.xml');
  a.click(); URL.revokeObjectURL(a.href);
}

function delFromRegister(id) {
  if (!confirm('Remove this profile from the register?')) return;
  var reg = getRegister().filter(function(r){return r.id!==id;});
  localStorage.setItem(REG_KEY,JSON.stringify(reg));
  renderRegister();
}


function exportRegisterJSON() {
  var reg = getRegister();
  if (!reg.length) { alert('No profiles in the register to export.'); return; }
  var blob = new Blob([JSON.stringify(reg, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'SPOS_Profile_Register_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importRegisterJSON(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var imported = JSON.parse(e.target.result);
      if (!Array.isArray(imported)) { alert('Invalid format: expected a JSON array.'); return; }
      var existing = getRegister();
      var existingIds = existing.map(function(r){ return r.id; });
      var newEntries = imported.filter(function(r){ return r.id &amp;&amp; existingIds.indexOf(r.id) &lt; 0; });
      var merged = newEntries.concat(existing);
      // Sort by date descending
      merged.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
      localStorage.setItem(REG_KEY, JSON.stringify(merged));
      alert('Imported ' + newEntries.length + ' new profile(s). ' + (imported.length - newEntries.length) + ' duplicate(s) skipped.');
      renderRegister();
    } catch(err) {
      alert('Failed to parse JSON file: ' + err.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function clearRegister() {
  if (!confirm('Clear all saved profiles? This cannot be undone.')) return;
  localStorage.removeItem(REG_KEY); renderRegister();
}

        : '&lt;button class=&quot;btn btn-primary btn-sm&quot; onclick=&quot;addCmpFromRegister(' + r.id + ')&quot;&gt;+ Add&lt;/button&gt;') +
    '&lt;/div&gt;';
  }).join('');
}

function handleCmpDrop(e) {
  e.preventDefault();
  document.getElementById('cmp-drop').classList.remove('dragover');
  var files = Array.from(e.dataTransfer.files).filter(function(f){ return f.name.toLowerCase().endsWith('.xml'); });
  files.forEach(parseCmpXMLFile);
}

function loadCmpFiles(input) {
  Array.from(input.files).forEach(parseCmpXMLFile);
  input.value = '';
}

function parseCmpXMLFile(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var parser = new DOMParser();
      var doc = parser.parseFromString(e.target.result, 'application/xml');
      var ns = 'http://www.meteogroup-maritime.com/spos/shipprofile';
      function g(tag) {
        var el = doc.getElementsByTagNameNS(ns,tag)[0] || doc.getElementsByTagName(tag)[0];
        return el ? el.textContent.trim() : '';
      }
      var profileName = g('name') || file.name.replace('.xml','');
      var addEls = Array.from(doc.getElementsByTagNameNS(ns,'add'));
      if (!addEls.length) addEls = Array.from(doc.getElementsByTagName('add'));
      var seen = {};
      var rows = [];
      addEls.forEach(function(el) {
        var key = el.getAttribute('speed')+'_'+el.getAttribute('fuel');
        if (seen[key]) return; seen[key]=true;
        rows.push({speed:parseFloat(el.getAttribute('speed')), fuel:parseFloat(el.getAttribute('fuel'))});
      });
      rows.sort(function(a,b){return a.speed-b.speed;});
      addCmpProfile({id:'file_'+Date.now()+'_'+Math.random(), name:profileName, rows:rows});
    } catch(err) { alert('Failed to parse: ' + file.name + '\n' + err.message); }
  };
  reader.readAsText(file);
}

function addCmpFromRegister(id) {
  if (cmpProfiles.some(function(p){ return p.id===id; })) return;
  var reg = getRegister();
  var entry = reg.find(function(r){ return r.id===id; });
  if (!entry || !entry.xml) return;
  try {
    var parser = new DOMParser();
    var doc = parser.parseFromString(entry.xml, 'application/xml');
    var ns = 'http://www.meteogroup-maritime.com/spos/shipprofile';
    function g(tag) {
      var el = doc.getElementsByTagNameNS(ns,tag)[0] || doc.getElementsByTagName(tag)[0];
      return el ? el.textContent.trim() : '';
    }
    var profileName = g('name') || entry.name;
    var addEls = Array.from(doc.getElementsByTagNameNS(ns,'add'));
    if (!addEls.length) addEls = Array.from(doc.getElementsByTagName('add'));
    var seen = {};
    var rows = [];
    addEls.forEach(function(el) {
      var key = el.getAttribute('speed')+'_'+el.getAttribute('fuel');
      if (seen[key]) return; seen[key]=true;
      rows.push({speed:parseFloat(el.getAttribute('speed')), fuel:parseFloat(el.getAttribute('fuel'))});
    });
    rows.sort(function(a,b){return a.speed-b.speed;});
    addCmpProfile({id:id, name:profileName, rows:rows});
    renderCompareTab();  // refresh register list to show checkmark
  } catch(err) { alert('Failed to load profile: ' + err.message); }
}

function addCmpProfile(profile) {
  if (cmpProfiles.some(function(p){ return p.id===profile.id; })) return;
  profile.color = CMP_COLORS[cmpProfiles.length % CMP_COLORS.length];
  cmpProfiles.push(profile);
  updateCmpChips();
  drawCmpChart();
}

function removeCmpProfile(id) {
  cmpProfiles = cmpProfiles.filter(function(p){ return p.id!==id; });
  // Reassign colours to maintain order
  cmpProfiles.forEach(function(p,i){ p.color = CMP_COLORS[i % CMP_COLORS.length]; });
  updateCmpChips();
  drawCmpChart();
  renderCompareTab();
}

function clearCompare() {
  cmpProfiles = [];
  if (cmpChartInstance) { cmpChartInstance.destroy(); cmpChartInstance=null; }
  updateCmpChips();
  document.getElementById('cmp-chart-section').style.display = 'none';
  renderCompareTab();
}

function updateCmpChips() {
  var chips = document.getElementById('cmp-chips');
  var listWrap = document.getElementById('cmp-loaded-list');
  if (!cmpProfiles.length) { listWrap.style.display='none'; return; }
  listWrap.style.display = 'block';
  chips.innerHTML = cmpProfiles.map(function(p) {
    return '&lt;div style=&quot;display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid '+p.color+';border-radius:4px;padding:4px 10px;font-size:12px;font-weight:600;&quot;&gt;' +
      '&lt;span style=&quot;width:10px;height:10px;border-radius:50%;background:'+p.color+';display:inline-block;flex-shrink:0;&quot;&gt;&lt;/span&gt;' +
      '&lt;span&gt;' + esc(p.name) + '&lt;/span&gt;' +
      '&lt;button onclick=&quot;removeCmpProfile(\''+p.id+'\')&quot; style=&quot;background:none;border:none;cursor:pointer;color:#999;font-size:14px;padding:0 2px;line-height:1;&quot; title=&quot;Remove&quot;&gt;&amp;#215;&lt;/button&gt;' +
    '&lt;/div&gt;';
  }).join('');
}

function drawCmpChart() {
  var sec = document.getElementById('cmp-chart-section');
  if (!cmpProfiles.length) { sec.style.display='none'; return; }
  sec.style.display = 'block';

  var datasets = cmpProfiles.map(function(p) {
    var sorted = p.rows.slice().sort(function(a,b){return a.speed-b.speed;});
    return {
      label: p.name,
      data: sorted.map(function(r){ return {x:r.speed, y:r.fuel}; }),
      borderColor: p.color,
      backgroundColor: p.color.replace(')', ',0.06)').replace('rgb(','rgba(') || 'rgba(0,0,0,0.06)',
      pointBackgroundColor: p.color,
      pointBorderColor: '#fff',
      pointBorderWidth: 1.5,
      pointRadius: 5,
      pointHoverRadius: 7,
      fill: false,
      tension: 0.35,
      borderWidth: 2.5
    };
  });

  if (cmpChartInstance) cmpChartInstance.destroy();
  var ctx = document.getElementById('cmpChart').getContext('2d');
  cmpChartInstance = new Chart(ctx, {
    type: 'line',
    data: { datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      parsing: false,
      plugins: {
        legend: {
          display: true,
          position: 'top',
          labels: { font:{family:'Open Sans',size:11}, color:'#3a5068', boxWidth:20, padding:16 }
        },
        tooltip: {
          backgroundColor:'#1a2533', borderColor:'#aabcce', borderWidth:1,
          titleColor:'#bfcfdf', bodyColor:'#e8f0f8',
          titleFont:{family:'Open Sans'}, bodyFont:{family:'Open Sans'},
          callbacks: {
            label: function(ctx) {
              return ctx.dataset.label + ' — ' + ctx.parsed.y + ' mT/day @ ' + ctx.parsed.x + ' kts';
            }
          }
        }
      },
      scales: {
        x: {
          type: 'linear',
          title: {display:true, text:'Speed [kts]', color:'#5a6e82', font:{family:'Open Sans',size:11}},
          grid: {color:'#cfdcea'},
          ticks: {color:'#5a6e82', font:{family:'Open Sans',size:10}}
        },
        y: {
          title: {display:true, text:'Fuel [mT/day]', color:'#5a6e82', font:{family:'Open Sans',size:11}},
          grid: {color:'#cfdcea'},
          ticks: {color:'#5a6e82', font:{family:'Open Sans',size:10}}
        }
      }
    }
  });

  // Build comparison data table
  buildCmpTable();
}

function buildCmpTable() {
  // Collect all unique speeds across all profiles
  var allSpeeds = [];
  cmpProfiles.forEach(function(p) {
    p.rows.forEach(function(r){ if(allSpeeds.indexOf(r.speed)&lt;0) allSpeeds.push(r.speed); });
  });
  allSpeeds.sort(function(a,b){return a-b;});

  var headerCells = '&lt;th style=&quot;white-space:nowrap;&quot;&gt;Speed [kts]&lt;/th&gt;' +
    cmpProfiles.map(function(p) {
      return '&lt;th style=&quot;white-space:nowrap;color:'+p.color+';&quot;&gt;'+esc(p.name)+'&lt;br&gt;&lt;span style=&quot;font-weight:400;color:var(--muted);font-size:10px;&quot;&gt;Fuel [mT/day]&lt;/span&gt;&lt;/th&gt;';
    }).join('');

  var bodyRows = allSpeeds.map(function(spd) {
    var cells = '&lt;td style=&quot;font-weight:600;&quot;&gt;'+spd+'&lt;/td&gt;' +
      cmpProfiles.map(function(p) {
        var match = p.rows.find(function(r){ return r.speed===spd; });
        return '&lt;td&gt;' + (match ? match.fuel : '&lt;span style=&quot;color:var(--muted);&quot;&gt;—&lt;/span&gt;') + '&lt;/td&gt;';
      }).join('');
    return '&lt;tr&gt;'+cells+'&lt;/tr&gt;';
  }).join('');

  document.getElementById('cmp-data-table').innerHTML =
    '&lt;div class=&quot;chart-header&quot; style=&quot;margin-bottom:10px;&quot;&gt;Tabular Comparison&lt;/div&gt;' +
    '&lt;table&gt;&lt;thead&gt;&lt;tr&gt;'+headerCells+'&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;'+bodyRows+'&lt;/tbody&gt;&lt;/table&gt;';
}

function clearAllData() {
  if (!confirm('Clear all data and start with a blank form?')) return;
  document.getElementById('imo-input').value = '';
  document.getElementById('mt-link-row').style.display = 'none';
  var st = document.getElementById('fetch-status');
  st.className=''; st.style.display='none'; st.textContent='';
  document.getElementById('v-name').value = '';
  document.getElementById('v-class').value = '';
  document.getElementById('v-condition').value = 'L';
  document.getElementById('v-lpp').value = '';
  document.getElementById('v-draft').value = '';
  document.getElementById('v-beam').value = '';
  fuelRows = JSON.parse(JSON.stringify(defaultRows));
  originalFuelRows = null;
  renderFuelTable(); renderChart();
  document.getElementById('other-fuel').value = '0';
  document.getElementById('paste-input').value = '';
  document.getElementById('mt-paste').value = '';
  generatedXML = '';
  document.getElementById('xml-output').textContent = '';
  document.getElementById('xml-preview-section').style.display = 'none';
  document.getElementById('comparison-section').style.display = 'none';
}
